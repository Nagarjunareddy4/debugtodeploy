  <!-- Structured Data: WebSite (enables Google sitelinks search) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "DebugToDeploy",
    "url": "https://www.debugtodeploy.com/",
    "description": "AI-accelerated learning platform for DevOps, SRE, and Cloud Engineers.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://www.debugtodeploy.com/?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Structured Data: SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "DebugToDeploy",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web",
    "url": "https://www.debugtodeploy.com/",
    "description": "AI-powered DevOps and Cloud Engineering learning platform with personalized roadmaps, interactive labs, mock interviews, and professional portfolios.",
    "offers": [
      {
        "@type": "Offer",
        "name": "Free Plan",
        "price": "0",
        "priceCurrency": "USD"
      },
      {
        "@type": "Offer",
        "name": "Pro Monthly",
        "price": "6",
        "priceCurrency": "USD",
        "billingIncrement": "P1M"
      }
    ]
  }
  </script>
